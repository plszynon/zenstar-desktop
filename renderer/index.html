<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>ZenStar</title>
<style>
    :root {
        --theme-color: #8E24AA;
    }
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Segoe UI', sans-serif;
        background: #1e1e1e;
        color: #eee;
        overflow: hidden;
    }
    #app {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    #toolbar {
        background: var(--theme-color);
        display: flex;
        align-items: center;
        padding: 8px;
        gap: 6px;
    }
    #toolbar button {
        background: rgba(255,255,255,0.15);
        border: none;
        color: white;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
    #toolbar button:hover {
        background: rgba(255,255,255,0.3);
    }
    #urlInput {
        flex: 1;
        padding: 8px 12px;
        border-radius: 18px;
        border: none;
        outline: none;
        font-size: 14px;
    }
    #tabBar {
        display: flex;
        background: #2a2a2a;
        padding: 4px 6px;
        gap: 4px;
        overflow-x: auto;
    }
    .tab-pill {
        background: #3a3a3a;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
        display: flex;
        align-items: center;
    }
    .tab-pill.active {
        background: #555;
    }
    .tab-close {
        margin-left: 8px;
        opacity: 0.7;
    }
    .tab-close:hover {
        opacity: 1;
    }
    .tab-add {
        background: #3a3a3a;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }
    #incognitoBadge {
        display: none;
        background: #111;
        color: #fff;
        text-align: center;
        padding: 4px;
        font-size: 12px;
    }
    #webviewContainer {
        flex: 1;
        position: relative;
    }
    #webviewContainer webview {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
    }
    #menuDropdown {
        display: none;
        position: absolute;
        top: 50px;
        right: 10px;
        background: #2a2a2a;
        border-radius: 8px;
        padding: 8px;
        z-index: 999;
        min-width: 220px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #menuDropdown.show { display: block; }
    #menuDropdown button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: #eee;
        padding: 10px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 13px;
    }
    #menuDropdown button:hover {
        background: #3a3a3a;
    }
    #colorPicker {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px;
    }
    .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #555;
    }
    #listModal {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    #listModal.show { display: flex; }
    #listModalBox {
        background: #2a2a2a;
        width: 500px;
        max-height: 70%;
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
    }
    #listModalItems {
        overflow-y: auto;
        margin-top: 10px;
    }
    .list-row {
        padding: 10px;
        border-bottom: 1px solid #3a3a3a;
        cursor: pointer;
        white-space: pre-line;
        font-size: 13px;
    }
    .list-row:hover { background: #3a3a3a; }
    .empty { color: #999; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div id="app">
    <div id="toolbar">
        <button id="btnBack">◀</button>
        <button id="btnForward">▶</button>
        <button id="btnReload">⟳</button>
        <input id="urlInput" type="text" placeholder="Wpisz adres lub szukaj..." />
        <button id="btnMenu">☰</button>
    </div>

    <div id="tabBar"></div>

    <div id="incognitoBadge">🕶 Tryb incognito – historia nie jest zapisywana</div>

    <div id="webviewContainer"></div>
</div>

<div id="menuDropdown">
    <button id="btnIncognito">Włącz incognito</button>
    <button id="btnAdblock">Wyłącz adblock</button>
    <button id="btnBookmarkAdd">Dodaj do zakładek</button>
    <button id="btnBookmarksList">Zakładki</button>
    <button id="btnHistory">Historia</button>
    <button id="btnImportBookmarks">Importuj zakładki z innej przeglądarki</button>
    <div style="font-size:12px; color:#aaa; padding: 6px 10px 2px;">Kolor motywu:</div>
    <div id="colorPicker"></div>
</div>

<div id="listModal">
    <div id="listModalBox">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <b id="listModalTitle"></b>
            <button id="closeModal" style="background:none;border:none;color:#eee;font-size:18px;cursor:pointer;">✕</button>
        </div>
        <div id="listModalItems"></div>
    </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
